name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Sesuaikan jika modul aplikasi punya nama lain (mis. app)
  GRADLE_MODULE: smarttubetv
  ANDROID_API: "33"
  BUILD_TOOLS: "33.0.2"
  NDK_VERSION: "23.1.7779620"

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android command-line tools & SDK components
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "Downloading Android command line tools..."
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-latest.zip"
          if [ ! -s cmdline-tools.zip ]; then
            echo "Download failed or file is empty; aborting."
            exit 1
          fi

          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"

          if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          elif [ ! -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            TOOLS_DIR=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name "cmdline-tools" | head -n1 || true)
            if [ -n "$TOOLS_DIR" ]; then
              mv "$TOOLS_DIR" "$SDK_ROOT/cmdline-tools/latest"
            fi
          fi

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}"

      - name: Show Java & Gradle info
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew :${{ env.GRADLE_MODULE }}:assembleDebug --no-daemon --stacktrace

      - name: Find and upload debug APK
        run: |
          set -euo pipefail
          APK=$(find "${GITHUB_WORKSPACE}/${{ env.GRADLE_MODULE }}/build/outputs/apk" -name "*-debug.apk" | head -n1 || true)

          if [ -z "$APK" ]; then](#)
